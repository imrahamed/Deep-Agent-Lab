name: Unit contracts
on:
  push:
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --locked --extra dev --extra notebook
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: uv run python scripts/coverage_report.py
      - run: uv run python scripts/check_course_links.py
